[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "music-ai-tagger"
version = "0.1.0"
description = "Local-first AI-powered music identification and tagging desktop app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.10,<7",
  "mutagen>=1.47,<2",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
ai = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
  "transformers>=4.40,<6",
]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.12,<1",
]

[project.gui-scripts]
music-ai-tagger = "music_app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/music_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "I001"]
