name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audio tools and Qt runtime (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools libegl1

      - name: Install audio tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg fpcalc -y --no-progress

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -v

      - name: Live Apple catalog smoke test
        if: runner.os == 'Linux'
        env:
          MUSIC_LIVE_ITUNES: "1"
        run: pytest tests/test_itunes_live.py -v
